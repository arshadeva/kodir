name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner GitHub; cukup terima lisensi + pastikan platform 35
      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      # Memasang Gradle 8.9 langsung, jadi tidak perlu gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Otacix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
